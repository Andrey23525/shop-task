services:
  pipeline-apid:
    image: nginx:1.23-alpine
    container_name: shop-nginx
    ports:
      - "8082:8082"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/var/log/nginx
      - ../shared:/shared:ro
    networks:
      - network
    depends_on:
      - event-ingest
      - pipeline-apid-impl
      - shard-splitter
      - mysql-pipeline
      - mysql-shard-0
      - mysql-shard-1
    restart: unless-stopped